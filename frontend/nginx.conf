# Same-origin front door: serve the SPA and reverse-proxy /api -> FastAPI.
# Standalone demo mode: THIS nginx terminates TLS itself (self-signed) and owns
# 80/443. HTTP (80) redirects to HTTPS (443). Cert/key are mounted at
# /etc/nginx/certs. (When this VM later becomes a shared multi-app host, TLS
# moves up to a shared reverse proxy — see docs/HOSTING_PLATFORM_PLAN.md.)

server {
    listen 80;
    server_name _;
    # Everything goes over TLS; bounce plain HTTP up to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Brochure uploads can reach MAX_UPLOAD_SIZE_MB (default 20). Give headroom
    # so nginx doesn't 413 before the backend can enforce its own limit.
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: unknown paths fall back to index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API: strip the /api prefix and forward to the backend container.
    #
    # The upstream host is held in a VARIABLE on purpose. With a literal
    # `proxy_pass http://backend:8000/`, nginx resolves "backend" once when the
    # worker starts and caches that IP for the life of the process — so the
    # moment Compose recreates the backend container (every deploy, and every
    # `restart: unless-stopped` recovery) it gets a new IP and nginx keeps
    # proxying to the dead one. The result is a PERMANENT 502 on /api/* while
    # the SPA at / keeps serving happily, because static files never touch the
    # proxy. That is not a transient blip you can wait out; only restarting
    # this container clears it.
    #
    # A variable defers resolution to request time, and `resolver` points at
    # Docker's embedded DNS so the lookup actually works inside the network.
    # Note the pairing: once proxy_pass takes a variable, nginx no longer does
    # the automatic "replace the matched prefix" rewrite that the old trailing
    # slash relied on, so the `rewrite ... break` below does it explicitly.
    # /api/chat/threads -> backend /chat/threads (routes have no /api prefix).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_host backend;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_host:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chat replies stream over Server-Sent Events. Buffering would hold the
        # whole response back until the stream closed, so disable it here and
        # allow a long read timeout for slow LLM responses.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
