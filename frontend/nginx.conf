# Same-origin front door: serve the SPA and reverse-proxy /api -> FastAPI.
# Standalone demo mode: THIS nginx terminates TLS itself (self-signed) and owns
# 80/443. HTTP (80) redirects to HTTPS (443). Cert/key are mounted at
# /etc/nginx/certs. (When this VM later becomes a shared multi-app host, TLS
# moves up to a shared reverse proxy — see docs/HOSTING_PLATFORM_PLAN.md.)

server {
    listen 80;
    server_name _;
    # Everything goes over TLS; bounce plain HTTP up to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Brochure uploads can reach MAX_UPLOAD_SIZE_MB (default 20). Give headroom
    # so nginx doesn't 413 before the backend can enforce its own limit.
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: unknown paths fall back to index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API: strip the /api prefix and forward to the backend container. The
    # trailing slash on proxy_pass replaces the matched "/api/" with "/", so
    # /api/chat/threads -> backend /chat/threads (routes have no /api prefix).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chat replies stream over Server-Sent Events. Buffering would hold the
        # whole response back until the stream closed, so disable it here and
        # allow a long read timeout for slow LLM responses.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
