# Production stack — STANDALONE demo mode (GCP VM 34.18.9.118, no domain).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# The `web` container owns 80/443 and terminates TLS itself with a self-signed
# cert. This is the quickest path to a working HTTPS demo. When this VM later
# becomes a shared multi-app host (n8n + other apps), TLS + routing move up to a
# shared reverse proxy and this app drops its host ports — see
# docs/HOSTING_PLATFORM_PLAN.md.
#
# The pipeline is FOUR process types, not one (see ARCHITECTURE.md / run.sh) —
# running only the API accepts uploads but never processes them:
#
#   backend     uvicorn API                 exactly 1
#   worker      python -m app.worker        scaled (concurrency == replicas)
#   reconciler  python -m app.reconciler    exactly 1
#   web         nginx: SPA + /api proxy      public entrypoint, TLS
#
# The database is Supabase (hosted) — there is no DB container here.
# Backend secrets come from backend/.env at runtime. Frontend VITE_* are BUILD
# args (Vite bakes them into the static bundle); set them in the repo-root .env,
# which Compose reads automatically for ${...} interpolation below.

services:
  backend:
    build: ./backend
    image: brochure-backend
    env_file:
      - ./backend/.env
    expose:
      - "8000"          # internal only; the web container reaches it by name
    restart: unless-stopped

  worker:
    build: ./backend             # same image as `backend`; Compose builds it once
    image: brochure-backend
    command: ["python", "-m", "app.worker"]
    env_file:
      - ./backend/.env
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      replicas: 4        # 4 workers keeps a batch moving without tripping 429s

  reconciler:
    build: ./backend             # same image as `backend`; Compose builds it once
    image: brochure-backend
    command: ["python", "-m", "app.reconciler"]
    env_file:
      - ./backend/.env
    depends_on:
      - backend
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_BACKEND_URL: /api
    image: brochure-web
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro    # self-signed cert generated on the VM
    restart: unless-stopped
